name: Build, verify and publish image

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - patch_rel_hr.py
      - patch_sr_latin.py
      - verify_image.py
      - .github/workflows/publish-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - patch_rel_hr.py
      - patch_sr_latin.py
      - verify_image.py
      - .github/workflows/publish-image.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: publish-grampsweb-bcs-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dejanrepic-lab/grampsweb-bcs
  UPSTREAM_REPOSITORY: ghcr.io/gramps-project/grampsweb

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check official Gramps Web release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          release_tag="$(gh api repos/gramps-project/gramps-web/releases/latest --jq '.tag_name')"
          version="${release_tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Nevažeća službena Gramps Web verzija: ${release_tag}"
            exit 1
          fi

          latest_image="${UPSTREAM_REPOSITORY}:latest"
          version_image="${UPSTREAM_REPOSITORY}:${version}"
          docker pull "${latest_image}"
          docker pull "${version_image}"

          latest_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${latest_image}")"
          version_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${version_image}")"
          if [[ "${latest_digest##*@}" != "${version_digest##*@}" ]]; then
            echo "::error::Oznake latest i ${version} ne vode na istu službenu sliku."
            echo "::error::latest=${latest_digest}; ${version}=${version_digest}"
            exit 1
          fi

          current_digest=""
          current_version=""
          if docker pull "${REGISTRY}/${IMAGE_NAME}:latest" >/dev/null 2>&1; then
            current_digest="$(docker image inspect --format '{{index .Config.Labels "io.github.dejanrepic-lab.grampsweb-bcs.upstream-digest"}}' "${REGISTRY}/${IMAGE_NAME}:latest")"
            current_version="$(docker image inspect --format '{{index .Config.Labels "io.github.dejanrepic-lab.grampsweb-bcs.upstream-version"}}' "${REGISTRY}/${IMAGE_NAME}:latest")"
          fi

          should_build=true
          if [[ "${{ github.event_name }}" == "schedule" \
                && "${current_digest}" == "${latest_digest}" \
                && "${current_version}" == "${version}" ]]; then
            should_build=false
          fi

          echo "upstream_image=${version_image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${latest_digest}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && steps.upstream.outputs.should_build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build, verify and publish
        id: build
        if: steps.upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            UPSTREAM_IMAGE=${{ steps.upstream.outputs.upstream_image }}
            UPSTREAM_DIGEST=${{ steps.upstream.outputs.digest }}
            UPSTREAM_VERSION=${{ steps.upstream.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write version summary
        if: always()
        shell: bash
        run: |
          version="${{ steps.upstream.outputs.version }}"
          previous="${{ steps.upstream.outputs.current_version }}"
          [[ -n "${version}" ]] || version="nepoznata"
          [[ -n "${previous}" ]] || previous="nije zabilježena"

          if [[ "${{ steps.upstream.outcome }}" != "success" ]]; then
            result="Provjera službene verzije nije uspjela"
          elif [[ "${{ steps.upstream.outputs.should_build }}" == "false" ]]; then
            result="Nema nove verzije; slika nije mijenjana"
          elif [[ "${{ steps.build.outcome }}" == "success" && "${{ github.event_name }}" == "pull_request" ]]; then
            result="Probna izgradnja i provjera su uspješne"
          elif [[ "${{ steps.build.outcome }}" == "success" ]]; then
            result="Slika je provjerena i objavljena"
          else
            result="Izgradnja ili provjera nije uspjela"
          fi

          {
            echo "## Gramps Web BCS"
            echo
            echo "| Stavka | Vrijednost |"
            echo "|---|---|"
            echo "| Službena Gramps Web verzija | **${version}** |"
            echo "| Prethodno objavljena BCS verzija | ${previous} |"
            echo "| Rezultat | ${result} |"
          } >> "${GITHUB_STEP_SUMMARY}"
