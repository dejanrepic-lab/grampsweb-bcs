name: Build, verify and publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - patch_rel_hr.py
      - patch_sr_latin.py
      - verify_image.py
      - .github/workflows/publish-image.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: publish-grampsweb-bcs
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dejanrepic-lab/grampsweb-bcs
  UPSTREAM_IMAGE: ghcr.io/gramps-project/grampsweb:latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream image
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "${UPSTREAM_IMAGE}"
          upstream_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${UPSTREAM_IMAGE}")"
          current_digest=""

          if docker pull "${REGISTRY}/${IMAGE_NAME}:latest" >/dev/null 2>&1; then
            current_digest="$(docker image inspect --format '{{index .Config.Labels "io.github.dejanrepic-lab.grampsweb-bcs.upstream-digest"}}' "${REGISTRY}/${IMAGE_NAME}:latest")"
          fi

          should_build=true
          if [[ "${{ github.event_name }}" == "schedule" && "${current_digest}" == "${upstream_digest}" ]]; then
            should_build=false
          fi

          echo "digest=${upstream_digest}" >> "${GITHUB_OUTPUT}"
          echo "should-build=${should_build}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.should-build == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build, verify and publish
        if: steps.upstream.outputs.should-build == 'true'
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            UPSTREAM_IMAGE=${{ env.UPSTREAM_IMAGE }}
            UPSTREAM_DIGEST=${{ steps.upstream.outputs.digest }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
